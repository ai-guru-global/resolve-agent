# ResolveAgent Platform Services Configuration
# This configuration supports deep integration with Higress AI Gateway
# and AgentScope runtime framework.

server:
  http_addr: ":8080"
  grpc_addr: ":9090"

database:
  host: localhost
  port: 5432
  user: resolveagent
  # SECURITY: Set password via environment variable RESOLVEAGENT_DATABASE_PASSWORD
  password: ""
  dbname: resolveagent
  sslmode: disable

redis:
  addr: "localhost:6379"
  db: 0

nats:
  url: "nats://localhost:4222"

runtime:
  grpc_addr: "localhost:9091"

# Higress AI Gateway Integration
# Go Registry serves as single source of truth, synced to Higress
gateway:
  # Enable Higress gateway integration
  enabled: false

  # Higress admin API URL
  admin_url: "http://localhost:8888"

  # Route synchronization interval (Go Registry -> Higress)
  sync_interval: "30s"

  # LLM Model Routing Configuration
  # All LLM calls from Python runtime go through Higress
  model_routing:
    enabled: true
    default_model: "qwen-plus"
    base_path: "/llm"

  # Gateway Authentication
  # Higress handles external auth, platform validates forwarded headers
  auth:
    enabled: false
    jwt_secret: ""  # Set via RESOLVEAGENT_GATEWAY_AUTH_JWT_SECRET
    jwt_issuer: "resolveagent"
    api_key_names:
      - "X-API-Key"
      - "Authorization"

  # Load Balancer Configuration
  # Higress handles external LB, this configures internal behavior
  load_balancer:
    strategy: "round_robin"  # round_robin, least_conn, random
    health_check: true
    check_interval: "10s"
    unhealthy_count: 3

# Telemetry Configuration
telemetry:
  enabled: false
  otlp_endpoint: "localhost:4317"
  service_name: "resolveagent-platform"
  metrics_enabled: true

# Store Configuration
# Controls which backend each registry uses for persistence.
store:
  # Default backend for all registries: "memory" or "postgres"
  backend: "postgres"

  # Per-registry backend override (optional, falls back to 'backend')
  registries:
    hooks: "postgres"
    rag_documents: "postgres"
    fta_documents: "postgres"
    code_analysis: "postgres"
    memory: "postgres"

  # Memory store specific settings
  memory:
    short_term_max_entries: 200
    long_term_prune_interval: "1h"
    long_term_default_ttl: "720h"

# MCP (Model Context Protocol) Integration
# Allows ResolveAgent to call external tools via standardized MCP protocol
mcp:
  enabled: false
  servers:
    # Example: filesystem access via MCP
    # - name: filesystem
    #   transport: stdio
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    #   env:
    #     HOME: /tmp
    #
    # Example: HTTP-based MCP server
    # - name: fetch
    #   transport: http
    #   url: http://localhost:3001/sse
    #   headers:
    #     Authorization: Bearer ${FETCH_TOKEN}
    #   timeout_seconds: 30

# =============================================================================
# Loop Engineering: Feedback Loop Configuration
# Closes the observe-orient-decide-act cycle across all subsystems.
# Signals from health, retry, workflow, and telemetry are aggregated and
# dispatched to external sinks for continuous improvement.
# =============================================================================
feedback:
  enabled: true
  ring_buffer_size: 1000
  aggregation_window: "5m"
  dispatch:
    webhook:
      enabled: false
      url: ""
    nats:
      enabled: false
      subject: "feedback.signals"
    log:
      enabled: true
      level: "info"

# =============================================================================
# Loop Engineering: Observability Closed Loop
# Metrics-driven decision making: collect -> aggregate -> alert -> act.
# Feedback signals are exported as Prometheus metrics and trigger automated
# actions (circuit breaking, notifications) based on configured thresholds.
# =============================================================================
observability_loop:
  enabled: true
  metrics:
    feedback_signals_total: true
    feedback_loop_duration_seconds: true
    retry_exhausted_total: true
    workflow_success_rate: true
  alerts:
    - name: "high_failure_rate"
      condition: "workflow_success_rate < 0.7"
      window: "5m"
      action: "notify"
    - name: "retry_storm"
      condition: "retry_exhausted_total > 50"
      window: "1m"
      action: "circuit_break"
