# =============================================================================
# ResolveAgent E2E Test Pipeline — Loop Engineering Validation Cycle
# =============================================================================
# Runs end-to-end tests against a full stack deployment.
# Triggered manually or on release branches to validate integration paths.
# =============================================================================

name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: "main"
  push:
    branches: ["release/**"]

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.12"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resolveagent
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: resolveagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: make build-go

      # platform 自带迁移（pkg/store/postgres 启动时执行，scripts/migration 为 UUID 旧 schema 已弃用，
      # 见 Makefile migrate-up/seed 的弃用告警），因此无需预跑 migrate/seed。
      - name: Start platform server
        env:
          RESOLVEAGENT_DATABASE_PASSWORD: testpassword
        run: |
          ./bin/resolveagent-server > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Wait for platform server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "platform ready"; break
            fi
            kill -0 "$(cat /tmp/server.pid)" 2>/dev/null || { echo "platform process died:"; cat /tmp/server.log; exit 1; }
            sleep 2
          done
          curl -sf http://localhost:8080/healthz > /dev/null || { echo "platform failed to become ready:"; cat /tmp/server.log; exit 1; }

      - name: Run E2E tests
        env:
          DATABASE_URL: "postgres://resolveagent:testpassword@localhost:5432/resolveagent?sslmode=disable"
        run: go test -tags=e2e -v -timeout 5m ./test/e2e/...

      - name: E2E feedback report
        if: always()
        run: |
          echo "=== E2E Feedback Loop Report ==="
          echo "Result: ${{ job.status }}"
          echo "Ref: ${{ github.ref }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
