apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resolveagent.name" . }}-platform
  labels:
    {{- include "resolveagent.labels" . | nindent 4 }}
    {{- include "resolveagent.platform.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platform.replicaCount }}
  selector:
    matchLabels:
      {{- include "resolveagent.platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resolveagent.platform.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: platform
          image: "{{ .Values.platform.image.repository }}:{{ .Values.platform.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.platform.service.httpPort }}
              name: http
            - containerPort: {{ .Values.platform.service.grpcPort }}
              name: grpc
          env:
            - name: RESOLVEAGENT_DATABASE_HOST
              value: {{ .Values.postgresql.host | quote }}
            - name: RESOLVEAGENT_DATABASE_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: RESOLVEAGENT_DATABASE_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: RESOLVEAGENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "resolveagent.name" . }}
                  key: database-password
            - name: RESOLVEAGENT_DATABASE_DBNAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: RESOLVEAGENT_REDIS_ADDR
              value: {{ .Values.redis.addr | quote }}
            - name: RESOLVEAGENT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "resolveagent.name" . }}
                  key: redis-password
            - name: RESOLVEAGENT_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: RESOLVEAGENT_SERVER_RUNTIME_ADDR
              value: "{{ include "resolveagent.name" . }}-runtime:{{ .Values.runtime.service.port }}"
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
