name: rule-route
version: "1.0.0"
description: "Zero-dependency portable rule-based router. Mirrors RuleStrategy with no resolveagent import. Safe for offline and sandboxed agents."
author: "resolveagent"
entry_point: "rule_route:main"
execution_mode: sandbox
inputs:
  - name: input_text
    type: string
    required: true
    description: "User input to route"
  - name: agent_id
    type: string
    required: false
    description: "Agent processing this request (informational only)"
outputs:
  - name: route_type
    type: string
    required: true
    description: "Selected route type (code_analysis, fta, skill, rag, direct)"
  - name: route_target
    type: string
    required: true
    description: "Specific target within the route"
  - name: confidence
    type: number
    required: true
    description: "Decision confidence score (0.0–1.0)"
  - name: reasoning
    type: string
    required: false
    description: "Explanation of the routing decision"
  - name: parameters
    type: object
    required: false
    description: "Additional routing parameters including matched_patterns, strategy, portable flag"
permissions:
  network_access: false
  file_system_read: false
  file_system_write: false
  timeout_seconds: 10
