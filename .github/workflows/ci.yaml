name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: cd python && uv sync --extra dev
      - run: cd python && uv run ruff check src/ tests/
      - run: cd python && uv run ruff format --check src/ tests/
      - run: cd python && uv run mypy src/resolveagent/
        continue-on-error: true

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v4
        with:
          file: coverage.out

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: cd python && uv sync --extra dev
      - run: cd python && uv run pytest tests/ -v --cov=resolveagent

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    needs: [lint-go, test-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-go

  test-web:
    name: Test WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install
      - run: cd web && pnpm lint
      - run: cd web && pnpm test
      - run: cd web && pnpm build

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build-go, test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/platform.Dockerfile
          push: false
          tags: resolveagent-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/runtime.Dockerfile
          push: false
          tags: resolveagent-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build webui image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/webui.Dockerfile
          push: false
          tags: resolveagent-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
