# =============================================================================
# ResolveAgent - Production Docker Compose
# =============================================================================
# Complete stack deployment including all application services
# and infrastructure dependencies.
#
# Usage:
#   cp .env.example .env   # Configure environment
#   docker compose up -d   # Start all services
#
# Services:
#   - platform:  Go platform service (HTTP:8080, gRPC:9090)
#   - runtime:   Python agent runtime (gRPC:9091)
#   - webui:     React web dashboard (HTTP:3000 -> Nginx:8080, 非 root 容器)
#   - postgres:  PostgreSQL 16 database
#   - redis:     Redis 7 cache & session store
#   - nats:      NATS JetStream message bus
# =============================================================================

name: resolveagent

services:
  # ===========================================================================
  # Application Services
  # ===========================================================================

  platform:
    build:
      context: ../..
      dockerfile: deploy/docker/platform.Dockerfile
      args:
        VERSION: ${RESOLVEAGENT_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${DOCKER_REGISTRY:-ghcr.io/ai-guru-global}/resolveagent-platform:${RESOLVEAGENT_VERSION:-latest}
    container_name: resolveagent-platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLATFORM_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${PLATFORM_GRPC_PORT:-9090}:9090"
    environment:
      # Server
      RESOLVEAGENT_SERVER_HTTP_ADDR: ":8080"
      RESOLVEAGENT_SERVER_GRPC_ADDR: ":9090"
      # Database
      RESOLVEAGENT_DATABASE_HOST: ${RESOLVEAGENT_DATABASE_HOST:-postgres}
      RESOLVEAGENT_DATABASE_PORT: ${RESOLVEAGENT_DATABASE_PORT:-5432}
      RESOLVEAGENT_DATABASE_USER: ${RESOLVEAGENT_DATABASE_USER:-resolveagent}
      RESOLVEAGENT_DATABASE_PASSWORD: ${RESOLVEAGENT_DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      RESOLVEAGENT_DATABASE_DBNAME: ${RESOLVEAGENT_DATABASE_DBNAME:-resolveagent}
      RESOLVEAGENT_DATABASE_SSLMODE: ${RESOLVEAGENT_DATABASE_SSLMODE:-disable}
      # Redis
      RESOLVEAGENT_REDIS_ADDR: ${RESOLVEAGENT_REDIS_ADDR:-redis:6379}
      RESOLVEAGENT_REDIS_PASSWORD: ${RESOLVEAGENT_REDIS_PASSWORD:-}
      RESOLVEAGENT_REDIS_DB: ${RESOLVEAGENT_REDIS_DB:-0}
      # NATS
      RESOLVEAGENT_NATS_URL: ${RESOLVEAGENT_NATS_URL:-nats://nats:4222}
      # Runtime
      RESOLVEAGENT_RUNTIME_GRPC_ADDR: ${RESOLVEAGENT_RUNTIME_GRPC_ADDR:-runtime:9091}
      # HTTP address of the Python runtime; takes precedence over the
      # localhost default baked into configs/resolveagent.yaml
      RESOLVEAGENT_SERVER_RUNTIME_ADDR: ${RESOLVEAGENT_SERVER_RUNTIME_ADDR:-runtime:9091}
      # Gateway
      RESOLVEAGENT_GATEWAY_ENABLED: ${RESOLVEAGENT_GATEWAY_ENABLED:-false}
      RESOLVEAGENT_GATEWAY_ADMIN_URL: ${RESOLVEAGENT_GATEWAY_ADMIN_URL:-}
      RESOLVEAGENT_GATEWAY_SYNC_INTERVAL: ${RESOLVEAGENT_GATEWAY_SYNC_INTERVAL:-30s}
      RESOLVEAGENT_GATEWAY_MODEL_ROUTING_ENABLED: ${RESOLVEAGENT_GATEWAY_MODEL_ROUTING_ENABLED:-true}
      RESOLVEAGENT_GATEWAY_MODEL_ROUTING_DEFAULT_MODEL: ${RESOLVEAGENT_GATEWAY_MODEL_ROUTING_DEFAULT_MODEL:-qwen-plus}
      RESOLVEAGENT_GATEWAY_AUTH_ENABLED: ${RESOLVEAGENT_GATEWAY_AUTH_ENABLED:-false}
      RESOLVEAGENT_GATEWAY_AUTH_JWT_SECRET: ${RESOLVEAGENT_GATEWAY_AUTH_JWT_SECRET:-}
      RESOLVEAGENT_GATEWAY_LOAD_BALANCER_STRATEGY: ${RESOLVEAGENT_GATEWAY_LOAD_BALANCER_STRATEGY:-round_robin}
      # Telemetry
      RESOLVEAGENT_TELEMETRY_ENABLED: ${RESOLVEAGENT_TELEMETRY_ENABLED:-false}
      RESOLVEAGENT_TELEMETRY_OTLP_ENDPOINT: ${RESOLVEAGENT_TELEMETRY_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - resolveagent-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  runtime:
    build:
      context: ../..
      dockerfile: deploy/docker/runtime.Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/ai-guru-global}/resolveagent-runtime:${RESOLVEAGENT_VERSION:-latest}
    container_name: resolveagent-runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUNTIME_GRPC_PORT:-9091}:9091"
    environment:
      RESOLVEAGENT_RUNTIME_HOST: "0.0.0.0"
      RESOLVEAGENT_RUNTIME_PORT: "9091"
      RESOLVEAGENT_AGENT_POOL_MAX_SIZE: ${RESOLVEAGENT_AGENT_POOL_MAX_SIZE:-100}
      RESOLVEAGENT_SELECTOR_STRATEGY: ${RESOLVEAGENT_SELECTOR_STRATEGY:-hybrid}
      RESOLVEAGENT_SELECTOR_CONFIDENCE_THRESHOLD: ${RESOLVEAGENT_SELECTOR_CONFIDENCE_THRESHOLD:-0.7}
      # Platform HTTP address (read by the Python runtime)
      RESOLVEAGENT_PLATFORM_ADDR: ${RESOLVEAGENT_PLATFORM_ADDR:-platform:8080}
      # LLM API Keys - names the Python runtime actually reads
      # (RESOLVEAGENT_LLM_QWEN/WENXIN/ZHIPU_API_KEY were never read)
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      WENXIN_API_KEY: ${WENXIN_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      # Telemetry
      RESOLVEAGENT_TELEMETRY_ENABLED: ${RESOLVEAGENT_TELEMETRY_ENABLED:-false}
      RESOLVEAGENT_TELEMETRY_OTLP_ENDPOINT: ${RESOLVEAGENT_TELEMETRY_OTLP_ENDPOINT:-}
    networks:
      - resolveagent-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  webui:
    build:
      context: ../..
      dockerfile: deploy/docker/webui.Dockerfile
    image: ${DOCKER_REGISTRY:-ghcr.io/ai-guru-global}/resolveagent-webui:${RESOLVEAGENT_VERSION:-latest}
    container_name: resolveagent-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - resolveagent-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: resolveagent-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${RESOLVEAGENT_DATABASE_USER:-resolveagent}
      POSTGRES_PASSWORD: ${RESOLVEAGENT_DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${RESOLVEAGENT_DATABASE_DBNAME:-resolveagent}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: init-db.sql is intentionally NOT mounted. It carries a stale
      # schema (UUID ids, no agents.type) that conflicts with the Go store's
      # own migration chain (pkg/store/postgres), breaking migration 5.
      # The platform runs all migrations itself at startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOLVEAGENT_DATABASE_USER:-resolveagent} -d ${RESOLVEAGENT_DATABASE_DBNAME:-resolveagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - resolveagent-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: resolveagent-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${RESOLVEAGENT_REDIS_PASSWORD:-}
    # --requirepass is enabled only when a password is configured
    command: >
      sh -c 'REQUIREPASS="";
      if [ -n "$$REDIS_PASSWORD" ]; then REQUIREPASS="--requirepass $$REDIS_PASSWORD"; fi;
      exec redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      $$REQUIREPASS'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resolveagent-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2-alpine
    container_name: resolveagent-nats
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    command: ["--js", "--store_dir", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - resolveagent-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  resolveagent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
