name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync
        working-directory: python

      - name: Lint
        run: uv run ruff check src/ tests/
        working-directory: python

      - name: Test
        run: uv run pytest tests/ -v
        working-directory: python

  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install
        working-directory: web

      - name: Lint
        run: pnpm run lint
        working-directory: web

      - name: Build
        run: pnpm run build
        working-directory: web

      - name: Test
        run: pnpm run test
        working-directory: web

  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Lint
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Build
        run: npm run build
        working-directory: mobile

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, python-test, web-test, mobile-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/runtime.Dockerfile
          push: false
          tags: resolve-agent/runtime:ci

      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/platform.Dockerfile
          push: false
          tags: resolve-agent/platform:ci

      - name: Build webui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/webui.Dockerfile
          push: false
          tags: resolve-agent/webui:ci
