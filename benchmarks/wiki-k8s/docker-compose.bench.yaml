# =============================================================================
# ResolveAgent - wiki-k8s benchmark override
# =============================================================================
# Adds the benchmark-specific wiring on top of the production compose file:
#   - runtime pointed at the MiniMax token-plan endpoint (chat)
#   - embedding-shim translating OpenAI embeddings format -> MiniMax embo-01
#   - milvus + etcd so the runtime RAG pipeline has a real vector store
#
# Usage (from deploy/docker-compose/):
#   docker compose -f docker-compose.yaml \
#       -f ../../benchmarks/wiki-k8s/docker-compose.bench.yaml up -d
# =============================================================================

services:
  runtime:
    environment:
      # LLM: MiniMax token plan, OpenAI-compatible direct mode
      RESOLVEAGENT_LLM_DIRECT: "true"
      LLM_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      LLM_DEFAULT_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
      KIMI_API_KEY: ${MINIMAX_API_KEY}
      # Embeddings: via local shim (OpenAI format -> MiniMax embo-01).
      # Model name pinned to text-embedding-v2 so the runtime picks dim=1536,
      # matching embo-01's output dimension.
      EMBEDDING_BASE_URL: http://embedding-shim:9000/v1
      EMBEDDING_API_KEY: bench-local
      EMBEDDING_MODEL: text-embedding-v2
      # Vector store
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      # Benchmark traffic must not trip the 60 rpm default limiter
      RESOLVEAGENT_RATE_LIMIT_RPM: "100000"
    depends_on:
      milvus:
        condition: service_healthy
      embedding-shim:
        condition: service_healthy

  embedding-shim:
    build:
      context: ../../benchmarks/wiki-k8s/shim
    container_name: resolveagent-embedding-shim
    restart: unless-stopped
    environment:
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      MINIMAX_EMBEDDING_MODEL: ${MINIMAX_EMBEDDING_MODEL:-embo-01}
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - resolveagent-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: resolveagent-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - resolveagent-net

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: resolveagent-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      # Embedded etcd panics on Docker Desktop / Apple Silicon; use the
      # standalone etcd container instead.
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - resolveagent-net

volumes:
  milvus_data:
    driver: local
  etcd_data:
    driver: local
