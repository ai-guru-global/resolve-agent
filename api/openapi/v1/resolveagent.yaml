openapi: "3.1.0"
info:
  title: ResolveAgent Platform API
  description: |
    REST API for the ResolveAgent Mega Agent Platform.
    This API provides endpoints for managing agents, skills, workflows,
    and model routing.
    The path/method surface of this document is contract-tested against
    pkg/server/router.go (see pkg/server/openapi_contract_test.go).
  version: "0.3.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: AI Guru Global
    url: https://github.com/ai-guru-global/resolve-agent

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: System
    description: System information
  - name: Agents
    description: Agent lifecycle management
  - name: Skills
    description: Skill registry and management
  - name: Workflows
    description: Workflow orchestration
  - name: RAG
    description: Retrieval-augmented collections and documents
  - name: Models
    description: Model routing and configuration
  - name: Config
    description: Runtime configuration
  - name: Hooks
    description: Lifecycle hooks and executions
  - name: FTA
    description: Fault tree analysis documents and results
  - name: Code Analysis
    description: Code analysis jobs and findings
  - name: Corpus
    description: Corpus import
  - name: Memory
    description: Conversation and long-term memory
  - name: Solutions
    description: Troubleshooting solutions and executions
  - name: Call Graphs
    description: Call graph capture and traversal
  - name: Traffic Captures
    description: Traffic capture management
  - name: Traffic Graphs
    description: Service dependency graphs

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getLiveness
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"

  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Successful response

  /api/v1/system/info:
